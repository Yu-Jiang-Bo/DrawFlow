<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">DrawFlow 轻量任务记录 · 初版风格审核原型</title>
  <desc id="desc">只保留最近任务列表、状态、时间和查看成品入口的简化任务记录页面。</desc>
  <style>.f{font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif}.t{fill:#17212b}.m{fill:#64748b}.q{fill:#91a0b2}.s{fill:#b9c7d7}.w{fill:#fff}.b{fill:#1456d9}.bt{fill:#2363c6}.g{fill:#1e7a53}.r{fill:#b4433a}.a{fill:#9a6509}.h1{font-size:23px;font-weight:700}.h2{font-size:20px;font-weight:700}.h3{font-size:16px;font-weight:700}.body{font-size:14px}.sm{font-size:12px}.xs{font-size:11px}</style>
  <rect width="1440" height="1024" fill="#edf1f5"/><rect width="254" height="1024" fill="#101c2c"/><rect x="254" width="1186" height="76" fill="#fff"/><line x1="254" y1="76" x2="1440" y2="76" stroke="#d8e1eb"/>
  <rect x="28" y="30" width="34" height="34" rx="9" fill="#1456d9"/><path d="M39 41h12v12H39zM42 45h6M42 49h6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><text class="f w h1" x="76" y="49">DrawFlow</text><text class="f s sm" x="28" y="93">订单效果图与 V2 工作台</text><text class="f q xs" x="29" y="147">工作台</text><text class="f s body" x="49" y="190">出图任务</text><text class="f s body" x="49" y="242">V2 工作台</text><rect x="18" y="268" width="218" height="42" rx="7" fill="#1f3e66" stroke="#2b5590"/><text class="f w body" x="49" y="294">任务记录</text><line x1="30" y1="919" x2="224" y2="919" stroke="#34485e"/><circle cx="43" cy="951" r="4" fill="#52c486"/><text class="f s sm" x="55" y="955">本机生产环境</text><text class="f q xs" x="30" y="980">任务与成品仅保存在本机</text>
  <text class="f t h2" x="286" y="35">任务记录</text><text class="f m sm" x="286" y="55">本机历史任务</text><rect x="1090" y="20" width="118" height="34" rx="17" fill="#e9f7ef" stroke="#c7e5d4"/><circle cx="1107" cy="37" r="4" fill="#35a86d"/><text class="f g sm" x="1118" y="41">本机已就绪</text><rect x="1218" y="20" width="150" height="34" rx="17" fill="#edf4ff" stroke="#cbddfb"/><circle cx="1236" cy="37" r="4" fill="#1456d9"/><text class="f bt sm" x="1247" y="41">中央服务已连接</text>
  <rect x="286" y="104" width="1082" height="122" rx="11" fill="#fff" stroke="#d8e1eb"/><text class="f t h2" x="314" y="148">最近任务</text><text class="f m sm" x="314" y="174">只保留状态、模板、时间和成品入口；不展开复杂详情面板。</text><rect x="1134" y="133" width="206" height="40" rx="7" fill="#1456d9"/><text class="f w body" x="1187" y="159">进入出图任务</text><text class="f q xs" x="314" y="205">视觉审核示例：具体筛选、下载和详情仍沿用既有能力。</text>
  <rect x="286" y="250" width="1082" height="488" rx="12" fill="#fff" stroke="#d8e1eb"/><text class="f t h3" x="314" y="292">本机任务</text><text class="f m xs" x="1245" y="292">仅显示最近 3 条</text><line x1="314" y1="316" x2="1340" y2="316" stroke="#e0e7ef"/><rect x="314" y="334" width="1026" height="36" fill="#f7f9fb"/><text class="f m xs" x="334" y="357">状态</text><text class="f m xs" x="494" y="357">模板</text><text class="f m xs" x="738" y="357">完成时间</text><text class="f m xs" x="952" y="357">成品</text><text class="f m xs" x="1220" y="357">操作</text>
  <rect x="314" y="371" width="1026" height="88" fill="#edf4ff"/><circle cx="341" cy="411" r="5" fill="#35a86d"/><text class="f g sm" x="355" y="415">已完成</text><text class="f t body" x="494" y="408">模板示例 A</text><text class="f m xs" x="494" y="430">任务示例编号</text><text class="f t sm" x="738" y="415">今天 10:26</text><text class="f m sm" x="952" y="408">成品已生成</text><text class="f q xs" x="952" y="430">PNG / ZIP</text><rect x="1200" y="393" width="112" height="34" rx="6" fill="#fff" stroke="#9db8e8"/><text class="f bt sm" x="1224" y="415">查看成品</text>
  <line x1="314" y1="459" x2="1340" y2="459" stroke="#e8edf2"/><circle cx="341" cy="501" r="5" fill="#1456d9"/><text class="f bt sm" x="355" y="505">渲染中</text><text class="f t body" x="494" y="498">模板示例 B</text><text class="f m xs" x="494" y="520">任务示例编号</text><text class="f t sm" x="738" y="505">今天 10:03</text><text class="f m sm" x="952" y="498">正在生成</text><text class="f q xs" x="952" y="520">处理中</text><text class="f q sm" x="1213" y="505">等待完成</text>
  <line x1="314" y1="548" x2="1340" y2="548" stroke="#e8edf2"/><circle cx="341" cy="590" r="5" fill="#d59625"/><text class="f a sm" x="355" y="594">待处理</text><text class="f t body" x="494" y="587">模板示例 C</text><text class="f m xs" x="494" y="609">任务示例编号</text><text class="f t sm" x="738" y="594">昨天 16:48</text><text class="f m sm" x="952" y="587">等待开始</text><text class="f q xs" x="952" y="609">队列中</text><text class="f q sm" x="1213" y="594">等待开始</text>
  <text class="f q xs" x="314" y="706">后续任务仍可从此页进入既有查看、下载或重试流程。</text>
  <rect x="286" y="764" width="1082" height="104" rx="12" fill="#f8fbff" stroke="#d4e0ee"/><text class="f t h3" x="314" y="808">记录保持简单</text><text class="f m sm" x="314" y="834">任务记录不承担配置和操作面板职责，只帮助快速回看任务状态与成品。</text>
</svg>
