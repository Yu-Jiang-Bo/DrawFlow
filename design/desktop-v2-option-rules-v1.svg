<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">DrawFlow V2 预设处理 · 初版风格审核原型</title>
  <desc id="desc">配置选项渲染预设、内容来源与素材绑定的 V2 工作台页面。</desc>
  <style>.f{font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif}.t{fill:#17212b}.m{fill:#64748b}.q{fill:#91a0b2}.s{fill:#b9c7d7}.w{fill:#fff}.b{fill:#1456d9}.bt{fill:#2363c6}.g{fill:#1e7a53}.a{fill:#9a6509}.h1{font-size:23px;font-weight:700}.h2{font-size:20px;font-weight:700}.h3{font-size:16px;font-weight:700}.body{font-size:14px}.sm{font-size:12px}.xs{font-size:11px}</style>
  <rect width="1440" height="1024" fill="#edf1f5"/><rect width="254" height="1024" fill="#101c2c"/><rect x="254" width="1186" height="76" fill="#fff"/><line x1="254" y1="76" x2="1440" y2="76" stroke="#d8e1eb"/>
  <rect x="28" y="30" width="34" height="34" rx="9" fill="#1456d9"/><path d="M39 41h12v12H39zM42 45h6M42 49h6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><text class="f w h1" x="76" y="49">DrawFlow</text><text class="f s sm" x="28" y="93">订单效果图与 V2 工作台</text><text class="f q xs" x="29" y="147">工作台</text><text class="f s body" x="49" y="190">出图任务</text><rect x="18" y="216" width="218" height="42" rx="7" fill="#1f3e66" stroke="#2b5590"/><text class="f w body" x="49" y="242">V2 工作台</text><text class="f s body" x="49" y="294">任务记录</text><line x1="30" y1="919" x2="224" y2="919" stroke="#34485e"/><circle cx="43" cy="951" r="4" fill="#52c486"/><text class="f s sm" x="55" y="955">本机生产环境</text><text class="f q xs" x="30" y="980">模板与渲染均受控处理</text>
  <text class="f t h2" x="286" y="35">V2 工作台</text><text class="f m sm" x="286" y="55">模板配置与发布流程</text><rect x="1090" y="20" width="118" height="34" rx="17" fill="#e9f7ef" stroke="#c7e5d4"/><circle cx="1107" cy="37" r="4" fill="#35a86d"/><text class="f g sm" x="1118" y="41">本机已就绪</text><rect x="1218" y="20" width="150" height="34" rx="17" fill="#edf4ff" stroke="#cbddfb"/><circle cx="1236" cy="37" r="4" fill="#1456d9"/><text class="f bt sm" x="1247" y="41">中央服务已连接</text>
  <rect x="286" y="104" width="1082" height="90" rx="11" fill="#fff" stroke="#d8e1eb"/><text class="f m xs" x="312" y="130">模板示例 A · 配置流程</text><rect x="312" y="145" width="112" height="30" rx="15" fill="#eaf2ff" stroke="#c6daf9"/><text class="f bt sm" x="335" y="165">01 上传扫描</text><rect x="438" y="145" width="112" height="30" rx="15" fill="#eaf2ff" stroke="#c6daf9"/><text class="f bt sm" x="461" y="165">02 字段配置</text><rect x="564" y="145" width="112" height="30" rx="15" fill="#1456d9"/><text class="f w sm" x="587" y="165">03 预设处理</text><rect x="690" y="145" width="112" height="30" rx="15" fill="#f6f8fa" stroke="#d8e1eb"/><text class="f m sm" x="713" y="165">04 样例预览</text><rect x="816" y="145" width="112" height="30" rx="15" fill="#f6f8fa" stroke="#d8e1eb"/><text class="f m sm" x="846" y="165">05 发布版本</text>
  <rect x="286" y="220" width="252" height="638" rx="12" fill="#fff" stroke="#d8e1eb"/><text class="f t h3" x="312" y="261">选项列表</text><rect x="312" y="279" width="200" height="36" rx="6" fill="#f8fafc" stroke="#cbd6e1"/><text class="f q sm" x="326" y="302">搜索 Design 或 F</text><rect x="312" y="335" width="200" height="52" rx="7" fill="#edf4ff" stroke="#b8d0f5"/><text class="f t sm" x="326" y="358">Design01</text><text class="f bt xs" x="326" y="377">当前配置</text><rect x="312" y="398" width="200" height="52" rx="7" fill="#fff" stroke="#e1e7ee"/><text class="f t sm" x="326" y="421">Design02</text><text class="f a xs" x="326" y="440">待处理</text><rect x="312" y="461" width="200" height="52" rx="7" fill="#fff" stroke="#e1e7ee"/><text class="f t sm" x="326" y="484">Font F1</text><text class="f m xs" x="326" y="503">已确认</text><text class="f q xs" x="312" y="828">选择项后配置内容处理</text>
  <rect x="562" y="220" width="510" height="638" rx="12" fill="#fff" stroke="#d8e1eb"/><text class="f t h2" x="590" y="261">Design01 · 预设处理</text><text class="f m sm" x="590" y="285">决定当前选项的文字、素材与槽位处理方式</text><line x1="590" y1="308" x2="1044" y2="308" stroke="#e0e7ef"/>
  <text class="f t sm" x="590" y="347">内容处理预设</text><rect x="590" y="361" width="454" height="42" rx="6" fill="#fff" stroke="#b9c7d7"/><text class="f t sm" x="606" y="387">直接替换文字</text><path d="M1015 378l7 7 7-7" fill="none" stroke="#65758a" stroke-width="1.8" stroke-linecap="round"/><text class="f m xs" x="590" y="430">选定预设后，按槽位确认订单来源与处理方式。</text>
  <rect x="590" y="456" width="454" height="168" rx="8" fill="#fbfcfd" stroke="#d8e1eb"/><text class="f t h3" x="610" y="488">槽位要求</text><text class="f m xs" x="610" y="510">内容来源</text><text class="f m xs" x="798" y="510">处理方式</text><text class="f t sm" x="610" y="550">slot_name</text><rect x="742" y="530" width="126" height="34" rx="5" fill="#fff" stroke="#c6d0dc"/><text class="f t xs" x="755" y="552">定制信息</text><rect x="882" y="530" width="142" height="34" rx="5" fill="#fff" stroke="#c6d0dc"/><text class="f t xs" x="896" y="552">替换文本</text><line x1="610" y1="580" x2="1024" y2="580" stroke="#e8edf2"/><text class="f t sm" x="610" y="608">slot_date</text><rect x="742" y="588" width="126" height="34" rx="5" fill="#fff" stroke="#c6d0dc"/><text class="f q xs" x="755" y="610">请选择字段</text><rect x="882" y="588" width="142" height="34" rx="5" fill="#fff" stroke="#c6d0dc"/><text class="f q xs" x="896" y="610">请选择方式</text>
  <rect x="590" y="656" width="454" height="110" rx="8" fill="#f8fbff" stroke="#d4e0ee"/><text class="f t h3" x="610" y="688">素材库绑定</text><text class="f m sm" x="610" y="713">当前预设不需要独立素材；有需要时沿用现有素材绑定。</text><text class="f q xs" x="610" y="744">预设、槽位与素材均为现有配置能力。</text>
  <rect x="1096" y="220" width="272" height="638" rx="12" fill="#fff" stroke="#d8e1eb"/><text class="f t h3" x="1120" y="261">模板能力与依赖</text><line x1="1120" y1="286" x2="1342" y2="286" stroke="#e0e7ef"/><rect x="1120" y="312" width="82" height="28" rx="14" fill="#eef4ff"/><text class="f bt xs" x="1141" y="331">可替换文本</text><rect x="1210" y="312" width="78" height="28" rx="14" fill="#eef4ff"/><text class="f bt xs" x="1230" y="331">尺寸边界</text><text class="f m sm" x="1120" y="384">当前核验</text><circle cx="1132" cy="419" r="5" fill="#35a86d"/><text class="f t sm" x="1146" y="424">文本槽位已识别</text><circle cx="1132" cy="466" r="5" fill="#d59625"/><text class="f t sm" x="1146" y="471">1 项待确认</text><line x1="1120" y1="510" x2="1342" y2="510" stroke="#e0e7ef"/><text class="f q xs" x="1120" y="828">右侧只展示现有核验信息</text>
  <rect x="286" y="884" width="1082" height="84" rx="10" fill="#fff" stroke="#d8e1eb"/><text class="f t h3" x="318" y="920">保存当前预设处理</text><text class="f m sm" x="318" y="945">继续沿用现有保存与选择下一项动作</text><rect x="1002" y="904" width="150" height="46" rx="7" fill="#fff" stroke="#b8c7d8"/><text class="f t body" x="1037" y="933">保存草稿</text><rect x="1164" y="904" width="174" height="46" rx="7" fill="#1456d9"/><text class="f w body" x="1197" y="933">保存并配置下一个</text>
</svg>
