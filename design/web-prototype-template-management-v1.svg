<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <defs>
    <style>
      .bg { fill: #f3f5f7; }
      .top { fill: #1f2933; }
      .card { fill: #ffffff; stroke: #d9e0e7; stroke-width: 1; }
      .panel { fill: #f8fafc; stroke: #d9e0e7; stroke-width: 1; }
      .line { stroke: #d9e0e7; stroke-width: 1; }
      .text { font-family: Arial, "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .muted { font-family: Arial, "Microsoft YaHei", sans-serif; fill: #687482; }
      .white { font-family: Arial, "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .blue { fill: #1f5eff; }
      .blueText { font-family: Arial, "Microsoft YaHei", sans-serif; fill: #1f5eff; }
      .greenBg { fill: #e8f6ef; stroke: #b9e4ce; stroke-width: 1; }
      .redBg { fill: #fff1f1; stroke: #ffc7c7; stroke-width: 1; }
      .chip { fill: #e8efff; stroke: #c7d7ff; stroke-width: 1; }
      .button { fill: #1f5eff; }
      .button2 { fill: #ffffff; stroke: #bdc8d3; stroke-width: 1; }
      .upload { fill: #f8fafc; stroke: #9db4d8; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .title { font-size: 20px; font-weight: 700; }
      .h2 { font-size: 16px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; fill: #1f2933; font-size: 13px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="980"/>

  <rect class="top" x="0" y="0" width="1440" height="68"/>
  <text class="white title" x="48" y="30">制图渲染服务</text>
  <text class="white small" x="48" y="52" opacity="0.72">模板管理 / 规则维护 / 模板准入</text>
  <text class="white body" x="1032" y="39" opacity="0.72">出图任务</text>
  <rect x="1130" y="18" width="96" height="32" rx="4" fill="#111827" stroke="#455466"/>
  <text class="white body" x="1150" y="39">模板管理</text>
  <text class="white body" x="1260" y="39" opacity="0.72">规则配置</text>
  <circle cx="1360" cy="34" r="5" fill="#7dd3a7"/>
  <text class="white small" x="1372" y="38" opacity="0.86">服务在线</text>

  <rect class="card" x="48" y="92" width="880" height="750" rx="6"/>
  <text class="text h2" x="72" y="126">模板管理</text>
  <rect class="chip" x="790" y="105" width="112" height="26" rx="4"/>
  <text class="blueText small" x="806" y="123">本地模板库</text>
  <line class="line" x1="48" y1="146" x2="928" y2="146"/>

  <text class="text label" x="72" y="186">模板 ID</text>
  <rect class="panel" x="72" y="202" width="392" height="44" rx="4"/>
  <text class="muted body" x="92" y="230">JJMB202607030001</text>

  <text class="text label" x="492" y="186">模板名称</text>
  <rect class="panel" x="492" y="202" width="392" height="44" rx="4"/>
  <text class="muted body" x="512" y="230">例如：皮质钥匙扣纯文字模板</text>

  <text class="text label" x="72" y="286">模板类型</text>
  <rect class="panel" x="72" y="302" width="392" height="44" rx="4"/>
  <text class="text body" x="92" y="330">纯文字颜色/设计位置模板</text>
  <text class="muted body" x="434" y="330">∨</text>

  <text class="text label" x="492" y="286">状态</text>
  <rect class="panel" x="492" y="302" width="392" height="44" rx="4"/>
  <text class="text body" x="512" y="330">启用</text>
  <text class="muted body" x="854" y="330">∨</text>

  <text class="text label" x="72" y="386">上传模板 AI 文件</text>
  <rect class="upload" x="72" y="404" width="812" height="104" rx="6"/>
  <text class="blueText body" x="388" y="446">点击上传 .ai 模板文件</text>
  <text class="muted small" x="322" y="474">系统保存到模板库，不要求用户填写服务端路径</text>

  <text class="text label" x="72" y="548">模板特有规则 JSON</text>
  <rect class="panel" x="72" y="566" width="812" height="176" rx="4"/>
  <text class="mono" x="92" y="598">{</text>
  <text class="mono" x="116" y="626">"template_id": "JJMB202607030001",</text>
  <text class="mono" x="116" y="654">"defaults": { "design": "Design2", "color": "Gold" },</text>
  <text class="mono" x="116" y="682">"rules": { "fit": "fit_to_bounds" }</text>
  <text class="mono" x="92" y="710">}</text>

  <rect class="button2" x="668" y="772" width="96" height="40" rx="4"/>
  <text class="text body" x="698" y="797">清空</text>
  <rect class="button" x="788" y="772" width="96" height="40" rx="4"/>
  <text class="white body" x="808" y="797">保存模板</text>

  <rect class="card" x="956" y="92" width="436" height="274" rx="6"/>
  <text class="text h2" x="980" y="126">模板准入检查</text>
  <line class="line" x1="956" y1="146" x2="1392" y2="146"/>
  <rect class="greenBg" x="980" y="172" width="388" height="40" rx="4"/>
  <text class="text body" x="1000" y="197">已上传 AI 模板文件</text>
  <rect class="greenBg" x="980" y="226" width="388" height="40" rx="4"/>
  <text class="text body" x="1000" y="251">已填写模板规则</text>
  <rect class="redBg" x="980" y="280" width="388" height="40" rx="4"/>
  <text class="text body" x="1000" y="305">待运行模板图层检查</text>

  <rect class="card" x="956" y="390" width="436" height="218" rx="6"/>
  <text class="text h2" x="980" y="424">字段说明</text>
  <line class="line" x1="956" y1="444" x2="1392" y2="444"/>
  <text class="muted small" x="980" y="480">模板 ID</text>
  <text class="text body" x="1080" y="480">用于订单匹配和模板目录命名</text>
  <line class="line" x1="980" y1="500" x2="1368" y2="500"/>
  <text class="muted small" x="980" y="530">模板类型</text>
  <text class="text body" x="1080" y="530">系统据此选择内部渲染流程</text>
  <line class="line" x1="980" y1="550" x2="1368" y2="550"/>
  <text class="muted small" x="980" y="580">规则 JSON</text>
  <text class="text body" x="1080" y="580">记录默认颜色、设计和尺寸约束</text>

  <rect class="card" x="956" y="632" width="436" height="210" rx="6"/>
  <text class="text h2" x="980" y="666">设计约束</text>
  <line class="line" x1="956" y1="686" x2="1392" y2="686"/>
  <text class="text body" x="980" y="724">不显示内部技术字段</text>
  <text class="text body" x="980" y="760">不让用户填写本机路径</text>
  <text class="text body" x="980" y="796">不显示调试参数</text>
  <text class="text body" x="980" y="832">模板规则由系统在渲染时读取</text>
</svg>
