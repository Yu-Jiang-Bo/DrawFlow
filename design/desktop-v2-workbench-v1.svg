<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">DrawFlow V2 工作台 · 初版风格审核原型</title>
  <desc id="desc">沿用完整生产工作台框架的 V2 模板配置、核验与发布页面。</desc>
  <style>
    .font{font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif}.text{fill:#17212b}.muted{fill:#64748b}.faint{fill:#91a0b2}.side{fill:#b9c7d7}.white{fill:#fff}.blue{fill:#1456d9}.blueText{fill:#2363c6}.green{fill:#1e7a53}.amber{fill:#9a6509}.h1{font-size:23px;font-weight:700}.h2{font-size:20px;font-weight:700}.h3{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.tiny{font-size:11px}.line{stroke:#d8e1eb}
  </style>
  <rect width="1440" height="1024" fill="#edf1f5"/><rect width="254" height="1024" fill="#101c2c"/><rect x="254" width="1186" height="76" fill="#fff"/><line x1="254" y1="76" x2="1440" y2="76" stroke="#d8e1eb"/>
  <rect x="28" y="30" width="34" height="34" rx="9" fill="#1456d9"/><path d="M39 41h12v12H39zM42 45h6M42 49h6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><text class="font white h1" x="76" y="49">DrawFlow</text><text class="font side small" x="28" y="93">订单效果图与 V2 工作台</text><text class="font faint tiny" x="29" y="147">工作台</text>
  <text class="font side body" x="49" y="190">出图任务</text><rect x="18" y="216" width="218" height="42" rx="7" fill="#1f3e66" stroke="#2b5590"/><text class="font white body" x="49" y="242">V2 工作台</text><text class="font side body" x="49" y="294">任务记录</text>
  <line x1="30" y1="919" x2="224" y2="919" stroke="#34485e"/><circle cx="43" cy="951" r="4" fill="#52c486"/><text class="font side small" x="55" y="955">本机生产环境</text><text class="font faint tiny" x="30" y="980">模板与渲染均受控处理</text>
  <text class="font text h2" x="286" y="35">V2 工作台</text><text class="font muted small" x="286" y="55">模板配置与发布流程</text><rect x="1075" y="20" width="132" height="34" rx="17" fill="#e9f7ef" stroke="#c7e5d4"/><circle cx="1093" cy="37" r="4" fill="#35a86d"/><text class="font green small" x="1104" y="41">本机已就绪</text><rect x="1218" y="20" width="150" height="34" rx="17" fill="#edf4ff" stroke="#cbddfb"/><circle cx="1236" cy="37" r="4" fill="#1456d9"/><text class="font blueText small" x="1247" y="41">中央服务已连接</text>

  <rect x="286" y="104" width="1082" height="102" rx="11" fill="#fff" stroke="#d8e1eb"/><text class="font muted tiny" x="312" y="133">模板核验流程</text>
  <rect x="312" y="149" width="118" height="32" rx="16" fill="#edf4ff" stroke="#cbdcf9"/><text class="font blueText small" x="335" y="170">01 上传扫描</text><rect x="442" y="149" width="118" height="32" rx="16" fill="#f6f8fa" stroke="#d8e1eb"/><text class="font muted small" x="468" y="170">02 结构配置</text><rect x="572" y="149" width="118" height="32" rx="16" fill="#f6f8fa" stroke="#d8e1eb"/><text class="font muted small" x="598" y="170">03 选项规则</text><rect x="702" y="149" width="118" height="32" rx="16" fill="#f6f8fa" stroke="#d8e1eb"/><text class="font muted small" x="728" y="170">04 样例预览</text><rect x="832" y="149" width="118" height="32" rx="16" fill="#f6f8fa" stroke="#d8e1eb"/><text class="font muted small" x="862" y="170">05 发布版本</text><text class="font faint tiny" x="1191" y="170">视觉审核示例</text>

  <rect x="286" y="232" width="254" height="626" rx="12" fill="#fff" stroke="#d8e1eb"/><text class="font text h3" x="312" y="274">共享模板</text><rect x="312" y="291" width="202" height="38" rx="6" fill="#f8fafc" stroke="#cbd6e1"/><text class="font faint small" x="326" y="315">搜索模板 ID 或名称</text><rect x="312" y="348" width="202" height="58" rx="7" fill="#edf4ff" stroke="#b8d0f5"/><text class="font text small" x="326" y="374">模板示例 A</text><text class="font blueText tiny" x="326" y="393">当前选择 · 已发布</text><rect x="312" y="418" width="202" height="58" rx="7" fill="#fff" stroke="#e1e7ee"/><text class="font text small" x="326" y="444">模板示例 B</text><text class="font muted tiny" x="326" y="463">等待配置</text><rect x="312" y="488" width="202" height="58" rx="7" fill="#fff" stroke="#e1e7ee"/><text class="font text small" x="326" y="514">模板示例 C</text><text class="font muted tiny" x="326" y="533">草稿版本</text><line x1="312" y1="780" x2="514" y2="780" stroke="#e0e7ef"/><text class="font faint tiny" x="312" y="810">视觉示例：沿用现有模板列表</text>

  <rect x="564" y="232" width="500" height="626" rx="12" fill="#fff" stroke="#d8e1eb"/><text class="font text h2" x="592" y="274">新建模板</text><text class="font muted small" x="592" y="297">填写基础信息后上传 AI 模板并扫描</text><line x1="592" y1="321" x2="1036" y2="321" stroke="#e0e7ef"/>
  <text class="font text small" x="592" y="352">模板 ID <tspan fill="#b4433a">*</tspan></text><rect x="592" y="364" width="444" height="38" rx="6" fill="#fff" stroke="#bcc9d7"/><text class="font faint small" x="606" y="389">例如 JJMB202608060001</text>
  <text class="font text small" x="592" y="430">模板名称 <tspan fill="#b4433a">*</tspan></text><rect x="592" y="442" width="444" height="38" rx="6" fill="#fff" stroke="#bcc9d7"/><text class="font faint small" x="606" y="467">输入中文模板名称</text>
  <text class="font text small" x="592" y="508">店铺 <tspan fill="#91a0b2">（选填）</tspan></text><rect x="592" y="520" width="444" height="38" rx="6" fill="#fff" stroke="#bcc9d7"/><text class="font faint small" x="606" y="545">选填</text>
  <text class="font text small" x="592" y="594">上传并扫描模板</text><rect x="592" y="607" width="444" height="111" rx="8" fill="#f8fbff" stroke="#9eb2c7" stroke-dasharray="7 6"/><path d="M802 627v23M794 637l8-10 8 10M789 666h26" fill="none" stroke="#1456d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="font text body" x="838" y="648">拖入已标注的 AI 模板</text><text class="font muted small" x="838" y="670">或点击选择文件后开始扫描</text>
  <rect x="592" y="744" width="444" height="80" rx="8" fill="#fbfcfd" stroke="#d8e1eb"/><text class="font text h3" x="612" y="775">扫描后进入配置</text><text class="font muted small" x="612" y="798">字段配置、预设处理与样例预览</text>

  <rect x="1088" y="232" width="280" height="626" rx="12" fill="#fff" stroke="#d8e1eb"/><text class="font text h3" x="1112" y="274">当前核验</text><rect x="1254" y="257" width="88" height="25" rx="13" fill="#fff4df"/><text class="font amber tiny" x="1274" y="274">待确认</text><line x1="1112" y1="300" x2="1342" y2="300" stroke="#e0e7ef"/>
  <circle cx="1124" cy="337" r="5" fill="#35a86d"/><text class="font text small" x="1138" y="342">模板文件已选择</text><text class="font muted tiny" x="1138" y="362">等待本机扫描</text><circle cx="1124" cy="402" r="5" fill="#1456d9"/><text class="font text small" x="1138" y="407">结构字段配置</text><text class="font muted tiny" x="1138" y="427">确认订单字段绑定</text><circle cx="1124" cy="467" r="5" fill="#d59625"/><text class="font text small" x="1138" y="472">选项映射</text><text class="font muted tiny" x="1138" y="492">仍有项目待核验</text><line x1="1112" y1="536" x2="1342" y2="536" stroke="#e0e7ef"/><text class="font muted small" x="1112" y="570">发布条件</text><text class="font text body" x="1112" y="595">完成核验后发布版本</text><text class="font faint tiny" x="1112" y="822">代表性状态仅用于视觉审核</text>

  <rect x="286" y="884" width="1082" height="84" rx="10" fill="#fff" stroke="#d8e1eb"/><text class="font text h3" x="318" y="920">继续配置当前模板</text><text class="font muted small" x="318" y="945">底部操作区仅组织已有保存、试渲染与发布动作</text><rect x="1012" y="904" width="142" height="46" rx="7" fill="#fff" stroke="#b8c7d8"/><text class="font text body" x="1052" y="933">保存草稿</text><rect x="1166" y="904" width="172" height="46" rx="7" fill="#1456d9"/><text class="font white body" x="1213" y="933">使用样例试渲染</text>
</svg>
